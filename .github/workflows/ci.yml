name: Graph RAG Benchmark CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-format:
    name: Linting & Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Development Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint Checks
        run: ruff check .

      - name: Run Ruff Format Checks
        run: ruff format --check .

  test-unit:
    name: Unit & Regression Tests (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Runtime and Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock requests-mock

      - name: Execute Unit Test Suite (Excluding Live Ollama Integration)
        run: |
          pytest tests/ -m "not integration" --junitxml=unit_test_results.xml

  docker-build:
    name: Container Build & Health Probe Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t graphrag-bench:ci .

      - name: Inspect Image Metadata
        run: |
          docker image inspect graphrag-bench:ci --format '{{.Config.Healthcheck}}'
