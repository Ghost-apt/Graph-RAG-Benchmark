services:
  graphrag-bench:
    build:
      context: .
      dockerfile: Dockerfile
    image: graphrag-bench:0.9.0
    container_name: graphrag-bench-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - APP_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=8501
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_LLM_MODEL=qwen3:8b
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - MAX_CONCURRENT_GENERATIONS=2
      - MAX_CONCURRENT_BENCHMARKS=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "scripts/health_check.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
