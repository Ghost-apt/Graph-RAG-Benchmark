[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrag-bench"
version = "0.1.0"
description = "Graph RAG Benchmark: Empirical comparison between Vector RAG, Graph RAG, and Hybrid RAG"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Graph RAG Benchmark Team" }
]
dependencies = [
    "requests>=2.31.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "streamlit>=1.32.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "requests-mock>=1.11.0,<2.0.0",
    "ruff>=0.3.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests requiring live Ollama service (deselect with '-m \"not integration\"')",
]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
